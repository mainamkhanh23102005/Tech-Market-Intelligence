name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==25.0.1
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements.lock
          .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
      - name: Install Node dependencies
        shell: pwsh
        run: npm ci
      - name: Run quality gates
        shell: pwsh
        run: |
          .\scripts\tasks.ps1 format-check
          .\scripts\tasks.ps1 lint
          .\scripts\tasks.ps1 typecheck
          .\scripts\tasks.ps1 test-unit
          .\scripts\tasks.ps1 test-evaluation
          .\scripts\tasks.ps1 web-test
          .\scripts\tasks.ps1 build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tech_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tech_market_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tech_market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run PostgreSQL integration gates
        run: python -m pytest -m integration
