[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tech-market-intelligence"
version = "0.0.0"
description = "Engineering foundation for Tech Market Intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "psycopg[binary]==3.2.9",
  "sqlalchemy==2.0.41",
  "uvicorn==0.34.3",
]

[project.scripts]
tech-market-ingestion = "tech_market_backend.ingestion.cli:main"
tech-market-evaluation = "tech_market_backend.taxonomy.evaluation_cli:main"

[project.optional-dependencies]
dev = [
  "alembic==1.16.1",
  "httpx==0.28.1",
  "mypy==1.16.0",
  "pytest==8.4.0",
  "ruff==0.11.12",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/tech_market_api",
  "packages/contracts/src/tech_market_contracts",
  "packages/backend/src/tech_market_backend",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["apps/api/src", "packages/contracts/src", "packages/backend/src"]
markers = ["integration: requires isolated PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api/src", "packages/contracts/src", "packages/backend/src"]
packages = ["tech_market_api", "tech_market_contracts", "tech_market_backend"]

[tool.hatch.envs.default]
features = ["dev"]
